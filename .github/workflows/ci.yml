name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture environment versions
        run: |
          echo "node: $(node --version)" > env-versions.txt
          echo "npm: $(npm --version)" >> env-versions.txt
          echo "platform: ${{ runner.os }}" >> env-versions.txt
          (uname -a 2>/dev/null || echo "uname unavailable") >> env-versions.txt
      - name: Boundary check
        run: npm run boundaries
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        env:
          NODE_OPTIONS: --trace-uncaught --unhandled-rejections=strict --enable-source-maps
        run: |
          npm test -- --reporter=verbose --reporter=github-actions
      - name: Write failure summary
        if: always()
        run: |
          echo "## Test results (${{ runner.os }}, attempt ${{ github.run_attempt }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build
